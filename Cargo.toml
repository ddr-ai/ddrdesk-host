[package]
name = "ddrdeskd"
version = "1.0.0"
edition = "2021"
description = "DDRDesk host daemon — low-latency remote desktop for Fedora KDE Plasma"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.3"
evdev = "0.12"
hex = "0.4"
hostname = "0.4"
if-addrs = "0.13"
igd-next = { version = "0.16", features = ["aio_tokio"] }
libc = "0.2"
mdns-sd = "0.11"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
